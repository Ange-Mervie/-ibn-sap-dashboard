services:
  db:
    image: mysql:8.3
    environment:
      MYSQL_DATABASE: ibn_dashboard_test
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ibn_app
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: mysql://ibn_app:${MYSQL_PASSWORD}@db:3306/ibn_dashboard_test
      SESSION_SECRET: ${SESSION_SECRET}
    depends_on:
      db:
        condition: service_healthy
        required: true
    networks:
      default: null
volumes:
  db_data:
    name: ibn-sap-dashboard_db_data
