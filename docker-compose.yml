services:
  db:
    image: mysql:8.3
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ibn_dashboard_test
      MYSQL_USER: ibn_app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: mysql://ibn_app:${MYSQL_PASSWORD}@db:3306/ibn_dashboard_test
      SESSION_SECRET: ${SESSION_SECRET}
    depends_on:
      - db
volumes:
  db_data:
